<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <g fill="none" stroke="#b8892b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">

    <!-- concentric guides -->
    <circle cx="200" cy="200" r="42"/>
    <circle cx="200" cy="200" r="60"/>
    <circle cx="200" cy="200" r="118"/>
    <circle cx="200" cy="200" r="126"/>
    <circle cx="200" cy="200" r="176"/>

    <!-- inner rosette: 8 petals -->
    <g>
      <path id="petal-in" d="M200 158 C214 176 214 190 200 200 C186 190 186 176 200 158 Z"/>
      <use href="#petal-in" transform="rotate(45 200 200)"/>
      <use href="#petal-in" transform="rotate(90 200 200)"/>
      <use href="#petal-in" transform="rotate(135 200 200)"/>
      <use href="#petal-in" transform="rotate(180 200 200)"/>
      <use href="#petal-in" transform="rotate(225 200 200)"/>
      <use href="#petal-in" transform="rotate(270 200 200)"/>
      <use href="#petal-in" transform="rotate(315 200 200)"/>
    </g>

    <!-- middle ring: 12 lotus petals -->
    <g>
      <path id="petal-mid" d="M200 64 C224 100 232 128 200 148 C168 128 176 100 200 64 Z"/>
      <use href="#petal-mid" transform="rotate(30 200 200)"/>
      <use href="#petal-mid" transform="rotate(60 200 200)"/>
      <use href="#petal-mid" transform="rotate(90 200 200)"/>
      <use href="#petal-mid" transform="rotate(120 200 200)"/>
      <use href="#petal-mid" transform="rotate(150 200 200)"/>
      <use href="#petal-mid" transform="rotate(180 200 200)"/>
      <use href="#petal-mid" transform="rotate(210 200 200)"/>
      <use href="#petal-mid" transform="rotate(240 200 200)"/>
      <use href="#petal-mid" transform="rotate(270 200 200)"/>
      <use href="#petal-mid" transform="rotate(300 200 200)"/>
      <use href="#petal-mid" transform="rotate(330 200 200)"/>
    </g>

    <!-- outer ring: 16 slender rays with beads -->
    <g>
      <g id="ray">
        <path d="M200 122 L200 76"/>
        <path d="M200 76 C190 62 196 50 200 42 C204 50 210 62 200 76 Z"/>
        <circle cx="200" cy="30" r="3.2"/>
      </g>
      <use href="#ray" transform="rotate(22.5 200 200)"/>
      <use href="#ray" transform="rotate(45 200 200)"/>
      <use href="#ray" transform="rotate(67.5 200 200)"/>
      <use href="#ray" transform="rotate(90 200 200)"/>
      <use href="#ray" transform="rotate(112.5 200 200)"/>
      <use href="#ray" transform="rotate(135 200 200)"/>
      <use href="#ray" transform="rotate(157.5 200 200)"/>
      <use href="#ray" transform="rotate(180 200 200)"/>
      <use href="#ray" transform="rotate(202.5 200 200)"/>
      <use href="#ray" transform="rotate(225 200 200)"/>
      <use href="#ray" transform="rotate(247.5 200 200)"/>
      <use href="#ray" transform="rotate(270 200 200)"/>
      <use href="#ray" transform="rotate(292.5 200 200)"/>
      <use href="#ray" transform="rotate(315 200 200)"/>
      <use href="#ray" transform="rotate(337.5 200 200)"/>
    </g>

    <!-- centre -->
    <circle cx="200" cy="200" r="12" fill="#b8892b" stroke="none" opacity="0.5"/>
  </g>
</svg>
