<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 220" preserveAspectRatio="xMidYMax meet">
  <defs>
    <linearGradient id="lotus" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#e9c9bb" stop-opacity="0.95"/>
      <stop offset="60%"  stop-color="#f0d8cd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#faeee6" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#d9c592" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#efe0b8" stop-opacity="0.55"/>
    </linearGradient>

    <!-- a single lotus bloom -->
    <g id="bloom">
      <path fill="url(#lotus)" d="M0 60 C-34 44 -52 20 -50 -8 C-30 4 -12 26 0 60 Z"/>
      <path fill="url(#lotus)" d="M0 60 C34 44 52 20 50 -8 C30 4 12 26 0 60 Z"/>
      <path fill="url(#lotus)" d="M0 62 C-22 34 -26 4 -14 -26 C2 -6 10 26 0 62 Z"/>
      <path fill="url(#lotus)" d="M0 62 C22 34 26 4 14 -26 C-2 -6 -10 26 0 62 Z"/>
      <path fill="url(#lotus)" d="M0 64 C-9 32 -6 4 0 -34 C6 4 9 32 0 64 Z"/>
      <path fill="none" stroke="#d8ab9a" stroke-width="1" opacity="0.5"
            d="M0 60 C-9 32 -6 4 0 -34 M0 60 C-20 34 -24 6 -13 -24 M0 60 C20 34 24 6 13 -24"/>
    </g>

    <!-- a leafy sprig -->
    <g id="sprig">
      <path fill="none" stroke="#cbb98a" stroke-width="1.6" stroke-linecap="round"
            d="M0 70 C6 40 2 16 -12 -10"/>
      <path fill="url(#leaf)" d="M-1 54 C-22 46 -32 30 -30 12 C-14 20 -4 36 -1 54 Z"/>
      <path fill="url(#leaf)" d="M1 46 C20 36 28 20 24 2 C10 12 2 28 1 46 Z"/>
      <path fill="url(#leaf)" d="M-4 26 C-22 20 -30 6 -28 -10 C-14 -2 -6 10 -4 26 Z"/>
      <path fill="url(#leaf)" d="M-2 16 C14 8 20 -6 17 -22 C5 -12 -1 2 -2 16 Z"/>
      <circle cx="-12" cy="-12" r="3" fill="#e0c894" opacity="0.8"/>
    </g>

    <!-- a curling vine scroll -->
    <g id="scroll">
      <path fill="none" stroke="#cdb387" stroke-width="1.5" stroke-linecap="round" opacity="0.85"
            d="M0 90 C40 70 66 40 60 6 C56 -16 36 -22 28 -6 C21 8 34 20 46 14"/>
      <path fill="none" stroke="#cdb387" stroke-width="1.2" stroke-linecap="round" opacity="0.6"
            d="M12 82 C34 74 48 56 48 34"/>
      <circle cx="46" cy="14" r="2.6" fill="#d9bd8b" opacity="0.85"/>
    </g>

    <!-- small five-petal blossom -->
    <g id="blossom">
      <g fill="#f4ded1" opacity="0.9">
        <ellipse cx="0" cy="-9" rx="5" ry="9"/>
        <ellipse cx="0" cy="-9" rx="5" ry="9" transform="rotate(72)"/>
        <ellipse cx="0" cy="-9" rx="5" ry="9" transform="rotate(144)"/>
        <ellipse cx="0" cy="-9" rx="5" ry="9" transform="rotate(216)"/>
        <ellipse cx="0" cy="-9" rx="5" ry="9" transform="rotate(288)"/>
      </g>
      <circle r="3" fill="#e3c489"/>
    </g>
  </defs>

  <!-- a fine double rule running behind the planting -->
  <g stroke="#d9c8a5" stroke-width="1" opacity="0.55">
    <path d="M0 186 H1440"/>
    <path d="M0 192 H1440" opacity="0.6"/>
  </g>

  <!-- left grouping -->
  <g opacity="0.9">
    <use href="#scroll" transform="translate(40 120) scale(1.05)"/>
    <use href="#sprig"  transform="translate(150 130) scale(1.1)"/>
    <use href="#bloom"  transform="translate(232 128) scale(0.9)"/>
    <use href="#sprig"  transform="translate(305 136) scale(-0.95 0.95)"/>
    <use href="#blossom" transform="translate(196 106) scale(0.9)"/>
  </g>

  <!-- centre grouping -->
  <g opacity="0.95">
    <use href="#sprig"  transform="translate(566 132) scale(1.15)"/>
    <use href="#bloom"  transform="translate(660 122) scale(1.15)"/>
    <use href="#blossom" transform="translate(720 92)"/>
    <use href="#bloom"  transform="translate(790 130) scale(0.85)"/>
    <use href="#sprig"  transform="translate(872 134) scale(-1.1 1.1)"/>
  </g>

  <!-- right grouping -->
  <g opacity="0.9">
    <use href="#sprig"  transform="translate(1120 134) scale(1.05)"/>
    <use href="#bloom"  transform="translate(1204 126) scale(0.95)"/>
    <use href="#blossom" transform="translate(1258 100) scale(0.85)"/>
    <use href="#sprig"  transform="translate(1300 130) scale(-1 1)"/>
    <use href="#scroll" transform="translate(1400 120) scale(-1.05 1.05)"/>
  </g>

  <!-- drifting petals -->
  <g fill="#eccfc0" opacity="0.65">
    <ellipse cx="420" cy="74"  rx="8" ry="4.5" transform="rotate(-24 420 74)"/>
    <ellipse cx="480" cy="112" rx="6" ry="3.5" transform="rotate(18 480 112)"/>
    <ellipse cx="962" cy="86"  rx="7" ry="4"   transform="rotate(32 962 86)"/>
    <ellipse cx="1042" cy="120" rx="5.5" ry="3" transform="rotate(-12 1042 120)"/>
  </g>

  <!-- the top edge is softened by a CSS mask on .hero__garden img -->
</svg>
